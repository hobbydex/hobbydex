name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"   # pick up new data daily

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the RC dataset
        uses: actions/checkout@v4
        with:
          repository: hobbydex/hobbydex-rc
          path: data-repo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate and export the dataset
        working-directory: data-repo
        run: |
          python3 -I tools/validate.py
          python3 -I tools/export.py ../data/hobbydex-rc.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          HOBBYDEX_DATA: data/hobbydex-rc.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

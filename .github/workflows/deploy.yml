name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"   # pick up new data daily

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # a running deploy always finishes; GitHub keeps only the newest waiting one

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out the RC dataset
        uses: actions/checkout@v7
        with:
          repository: hobbydex/hobbydex-rc
          path: data-repo
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate and export the dataset
        working-directory: data-repo
        run: |
          python3 -I tools/validate.py
          python3 -I tools/export.py ../data/hobbydex-rc.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          HOBBYDEX_DATA: data/hobbydex-rc.json
      # the same checks as CI: nothing is published while they fail, whatever started the deploy
      - name: Search tests (ranking rules and the built index)
        run: npm test
      - name: Type check
        run: npm run check
      # IndexNow: compare page hashes with the live manifest; adds dist/indexnow-manifest.json.gz
      - name: IndexNow - list changed pages
        continue-on-error: true
        run: node tools/indexnow.mjs plan --dist dist --out indexnow-plan.json
      - name: IndexNow - keep the list for after the deploy
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: indexnow-plan
          path: indexnow-plan.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
  # tells IndexNow search engines which pages changed; never fails the deploy
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools/indexnow.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          name: indexnow-plan
      - name: Submit changed pages
        run: node tools/indexnow.mjs submit --plan indexnow-plan.json || true

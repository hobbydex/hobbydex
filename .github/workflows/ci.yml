name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the sitemap's lastmod of static pages is their source file's last commit
      - name: Check out the RC dataset
        uses: actions/checkout@v7
        with:
          repository: hobbydex/hobbydex-rc
          path: data-repo
          fetch-depth: 0   # export.py dates every record by its last commit
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Export the dataset
        working-directory: data-repo
        run: python3 -I tools/export.py ../data/hobbydex-rc.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - name: Build the site
        run: npm run build
        env:
          HOBBYDEX_DATA: data/hobbydex-rc.json
      # fails on any internal link whose target page does not exist
      - name: Internal link check
        run: node tools/check-links.mjs --max 0
      # every redirect page has its 301 entry in redirects.caddy, and every target is a live page
      - name: Redirect map check
        run: node tools/redirects.mjs --check --stubs .astro/redirect-stubs.json
      - name: Search tests (ranking rules and the built index)
        run: npm test
      - name: Type check
        run: npm run check

  # pull requests only: checks the authors and Co-authored-by emails of base..head
  commit-authors:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the range base..head needs the PR's commits and the base
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test of the commit author check
        run: python3 -I tools/test_check_commit_authors.py
      - name: Commits name only allowed emails
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -I tools/check_commit_authors.py "$BASE" "$HEAD_SHA"

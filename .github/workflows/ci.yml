name: Build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out the RC dataset
        uses: actions/checkout@v7
        with:
          repository: hobbydex/hobbydex-rc
          path: data-repo
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Export the dataset
        working-directory: data-repo
        run: python3 -I tools/export.py ../data/hobbydex-rc.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the site
        run: npm run build
        env:
          HOBBYDEX_DATA: data/hobbydex-rc.json
      - name: Search tests (ranking rules and the built index)
        run: npm test
      - name: Type check
        run: npm run check
